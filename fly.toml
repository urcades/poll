# Fly.io config. Before first deploy:
#   fly launch --no-deploy   (or edit `app` below, then `fly apps create`)
#   fly volumes create poll_data --size 1
#   fly deploy
# Keep this at exactly one machine: SQLite lives on the volume.
#   fly scale count 1

app = "poll"
primary_region = "ewr"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DB_PATH = "/data/votes.sqlite"
  # Fly's proxy sets Fly-Client-IP; needed for per-IP rate limiting.
  ADDRESS_HEADER = "Fly-Client-IP"

[[mounts]]
  source = "poll_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
